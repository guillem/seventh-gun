name: Release

# A release begins with a v<package-version> tag on main. Manual dispatch only
# exercises preflight; it cannot publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Publishing is serialized. A delayed older tag re-runs preflight immediately
# before publication, so it cannot replace the newer release's latest tags.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag, version, ancestry, and release ordering
        run: node .github/scripts/release-preflight.mjs

  test:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e

  package-smoke:
    needs: [preflight, test]
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:dist
      - run: test -f dist/client/LICENSE && test -f dist/client/THIRD-PARTY.md
      - id: pack
        run: echo "tarball=$(npm pack --json | node -e \"let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))\")" >> "$GITHUB_OUTPUT"
      - run: node .github/scripts/smoke-package.mjs "${{ steps.pack.outputs.tarball }}"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}

  static-artifact:
    needs: [preflight, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:dist
      - run: test -f dist/client/LICENSE && test -f dist/client/THIRD-PARTY.md
      - name: Build static archive with complete notices
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir static-release
          cp -R dist/client/. static-release/
          cp LICENSE THIRD-PARTY.md static-release/
          tar -czf "seventh-gun-$version-static.tar.gz" -C static-release .
      - uses: actions/upload-artifact@v4
        with:
          name: static-release
          path: seventh-gun-*-static.tar.gz

  container-smoke:
    needs: [preflight, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the self-host image
        run: |
          docker build -t seventh-gun:smoke .
          docker run --rm -d --name seventh-gun-smoke -p 18080:8080 seventh-gun:smoke
          trap 'docker logs seventh-gun-smoke; docker rm -f seventh-gun-smoke || true' EXIT
          for attempt in $(seq 1 20); do curl --fail http://127.0.0.1:18080/health && break; sleep 1; done
          curl --fail http://127.0.0.1:18080/ | grep -q 'src="/assets/.*\.js"'
          docker exec seventh-gun-smoke test -f /app/LICENSE
          docker exec seventh-gun-smoke test -f /app/THIRD-PARTY.md
          docker exec seventh-gun-smoke test -f /app/dist/client/LICENSE
          docker exec seventh-gun-smoke test -f /app/dist/client/THIRD-PARTY.md
          docker rm -f seventh-gun-smoke
          trap - EXIT

  publish-npm:
    needs: [preflight, package-smoke, container-smoke, static-artifact]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck release ordering before publication
        run: node .github/scripts/release-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node .github/scripts/publish-npm.mjs

  publish-image:
    needs: [preflight, package-smoke, container-smoke, static-artifact]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck release ordering before publication
        run: node .github/scripts/release-preflight.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  finalize-release:
    needs: [preflight, publish-npm, publish-image, static-artifact]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-release
      - uses: softprops/action-gh-release@v2
        with:
          files: seventh-gun-*-static.tar.gz
          generate_release_notes: true
